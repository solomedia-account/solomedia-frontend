services:
  backend:
    build: ./backend
    container_name: solomedia-backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: solomedia-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
