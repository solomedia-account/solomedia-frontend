# Nginx configuration for solomedianet.com
# Place this file at: /etc/nginx/sites-available/solomedianet.com
# Then run: sudo ln -s /etc/nginx/sites-available/solomedianet.com /etc/nginx/sites-enabled/
# And: sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    server_name solomedianet.com www.solomedianet.com;

    # Redirect HTTP to HTTPS (after SSL is obtained)
    # Comment this out initially until you have SSL certificate
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}

