name: Deploy Frontend to Oracle Cloud VM

on:
  push:
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Frontend VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FRONTEND_VM_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate to project directory
            cd ~/solomedia-frontend || (cd ~ && git clone https://github.com/solomedia-account/solomedia-frontend.git && cd ~/solomedia-frontend)

            # Pull latest changes
            git pull origin master

            # Stop and remove existing container
            docker stop solomedia-frontend || true
            docker rm solomedia-frontend || true

            # Remove old image to free up space
            docker rmi solomedia-frontend || true

            # Clean up build cache and unused resources
            docker system prune -af || true

            # Remove any cached .next directory if it exists
            rm -rf .next || true

            # Build new image with API URL
            docker build --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} -t solomedia-frontend .

            # Run new container
            docker run -d \
              --name solomedia-frontend \
              -p 3000:3000 \
              -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
              -e NODE_ENV=production \
              -e NODE_OPTIONS=--max-old-space-size=768 \
              --restart unless-stopped \
              solomedia-frontend

            # Wait for container to start
            sleep 15

            # Check container status
            docker ps | grep solomedia-frontend

            # Show recent logs
            docker logs --tail 20 solomedia-frontend

            # Health check
            curl -f http://localhost:3000 || exit 1

            echo "Frontend deployment successful!"
